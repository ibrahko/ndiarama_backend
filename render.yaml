services:
  - type: web
    name: ndiarama-backend
    env: python
    plan: free
    region: frankfurt
    pythonVersion: "3.13.0"
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "ndiarama-backend.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      # Mettre à jour avec l'URL réelle du frontend après déploiement
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ndiarama-front.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ndiarama-backend.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ndiarama-db
          property: connectionString
      - key: DEFAULT_FROM_EMAIL
        value: "no-reply@ndiarama.com"
      - key: CONTACT_EMAIL
        value: "contact@ndiarama.com"
      - key: LOG_LEVEL
        value: "INFO"
      # Superuser créé automatiquement au premier déploiement
      # Définir ces variables manuellement dans le dashboard Render
      # - key: DJANGO_SUPERUSER_USERNAME
      # - key: DJANGO_SUPERUSER_EMAIL
      # - key: DJANGO_SUPERUSER_PASSWORD

databases:
  - name: ndiarama-db
    plan: free
    databaseName: ndiarama
    user: ndiarama_user
